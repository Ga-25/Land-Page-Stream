<!DOCTYPE html>
<html lang="pt-BR">
<head>

   

<!-- Meta Pixel -->

if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';

    height="1"

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>Ativar Cadastro - StreamForce</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{
      --bg:#0f1115;
      --panel:#171a21;
      --soft:#232838;
      --txt:#e7e9ee;
      --muted:#a9b0c0;
      --primary:#3b82f6;
      --primary-2:#2563eb;
      --success:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --glow:0 15px 40px rgba(0,0,0,.35);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial;
      background: radial-gradient(1200px 800px at 20% -10%, #1b2440 0%, transparent 60%),
                  radial-gradient(1200px 800px at 110% 110%, #262036 0%, transparent 40%),
                  var(--bg);
      color:var(--txt);
      display:flex;align-items:center;justify-content:center;
      padding:24px;
    }
    .wrap{
      width:100%;
      max-width:720px;
      background:linear-gradient(180deg, rgba(255,255,255,.04), transparent 20%) , var(--panel);
      border:1px solid rgba(255,255,255,.06);
      box-shadow:var(--glow);
      padding:28px;
      border-radius:var(--radius);
      position:relative;
      overflow:hidden;
    }
    .brand{
      display:flex;align-items:center;gap:12px;margin-bottom:12px;
      font-weight:700;letter-spacing:.3px
    }
    .brand .dot{width:10px;height:10px;border-radius:999px;background:linear-gradient(45deg,var(--primary),#8b5cf6);box-shadow:0 0 18px rgba(59,130,246,.6)}
    .title{
      margin:0 0 16px 0;
      font-size:1.7rem;
      line-height:1.2;
    }
    .sub{color:var(--muted);margin:0 0 22px 0}
    .progress{
      background:#111420;
      border:1px solid rgba(255,255,255,.08);
      height:12px;border-radius:999px;
      overflow:hidden;position:relative;
    }
    .progress .fill{
      position:absolute;left:0;top:0;bottom:0;width:0%;
      background:linear-gradient(90deg, var(--warn), #fb923c);
      transition:width .35s ease, background .35s ease;
    }
    .progress-label{display:flex;justify-content:space-between;margin:8px 2px 18px 2px;color:var(--muted);font-size:.9rem}
    form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .full{grid-column:1/-1}
    label{font-size:.95rem;margin:2px 0 6px 2px;display:block;color:#cbd5e1}
    input{
      width:100%;background:#0f1320;
      border:1px solid rgba(255,255,255,.08);
      padding:14px 12px;border-radius:12px;color:var(--txt);
      outline:none;transition:border .2s, transform .15s;
    }
    input:focus{border-color:var(--primary);transform:translateY(-1px)}
    input.valid{border-color:rgba(34,197,94,.7)}
    input.invalid{border-color:rgba(239,68,68,.8);background:#1b0f12}
    .err{display:none;color:#fecaca;font-size:.85rem;margin-top:6px}
    .row{display:flex;flex-direction:column}
    .btn{
      grid-column:1/-1;
      background:linear-gradient(45deg,var(--primary),var(--primary-2));
      border:none;color:white;font-weight:700;
      padding:14px;border-radius:14px;cursor:pointer;
      transition:transform .1s ease, opacity .2s ease, box-shadow .2s ease;
      box-shadow:0 10px 28px rgba(59,130,246,.35);
    }
    .btn:hover{opacity:.95}
    .btn:active{transform:translateY(1px)}
    .btn.loading{position:relative;color:transparent;pointer-events:none}
    .btn.loading:after{
      content:"";position:absolute;inset:0;margin:auto;
      width:20px;height:20px;border-radius:50%;
      border:3px solid rgba(255,255,255,.25);border-top-color:#fff;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .check{
      display:none;justify-content:center;align-items:center;
      gap:8px;margin:14px 0 0 0;color:var(--success);font-weight:700
    }
    .check.show{display:flex}
    .sec{
      margin-top:16px;color:var(--muted);text-align:center;font-size:.95rem
    }
    .notice{
      position:fixed;top:20px;right:20px;z-index:9999;
      background:#111826;color:white;padding:14px 16px;border-radius:12px;
      border:1px solid rgba(255,255,255,.1);box-shadow:var(--glow);
      animation:slideIn .25s ease both;max-width:320px;font-weight:600
    }
    @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
    @keyframes slideOut{to{opacity:0;transform:translateX(20px)}}
    /* A/B in-app counter */
    .ab-counter{
      grid-column:1/-1;
      background:rgba(239,68,68,.08);
      border:1px solid rgba(239,68,68,.35);
      padding:14px;border-radius:14px;text-align:center;margin-bottom:6px
    }
    .ab-counter strong{color:#fecaca}
    /* Exit / idle popup */
    .pop{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:9998
    }
    .pop-card{
      width:min(480px,92vw);background:var(--panel);border:1px solid rgba(255,255,255,.08);
      border-radius:16px;padding:20px;box-shadow:var(--glow);text-align:center
    }
    .pop h3{margin:0 0 8px 0}
    .pop p{color:var(--muted);margin:0 0 14px 0}
    .pop .actions{display:flex;gap:10px;justify-content:center}
    .pop .actions button{padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .pop .final{background:linear-gradient(45deg,#ef4444,#b91c1c);color:white}
    .pop .close{background:#0f1320;color:#e5e7eb;border:1px solid rgba(255,255,255,.08)}
    @media (max-width:640px){
      form{grid-template-columns:1fr}
      .title{font-size:1.5rem}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span> StreamForce</div>
    <h1 class="title">Complete sua assinatura</h1>
    <p class="sub">Preencha seus dados para ativar seu acesso premium.</p>

    <div class="progress" aria-hidden="true">
      <div class="fill" id="progress-fill"></div>
    </div>
    <div class="progress-label"><span>Progresso</span><span id="progress-percent">0%</span></div>

    <form id="registrationForm" novalidate>
      <div class="row full">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" class="form-input" placeholder="Ex.: Maria Silva" required autocomplete="name" />
        <div id="nome-error" class="err"></div>
      </div>

      <div class="row">
        <label for="email">Email para contato</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="voce@email.com" required autocomplete="email" />
        <div id="email-error" class="err"></div>
      </div>

      <div class="row">
        <label for="whatsapp">WhatsApp</label>
        <input type="tel" id="whatsapp" name="whatsapp" class="form-input" placeholder="(11) 99999-9999" required autocomplete="tel" />
        <div id="whatsapp-error" class="err"></div>
      </div>

      <input type="hidden" id="transacao" value="N/A" />

      <div id="ab-counter-slot" class="full"></div>

      <button id="submitBtn" class="btn" type="submit">Ativar Cadastro</button>
    </form>

    <div id="successCheckmark" class="check">✅ Cadastro ativado!</div>
    <div class="sec">🔒 Seus dados estão protegidos e criptografados</div>
  </div>

  <script>
const CONFIG = {
  whatsappNumber: '5577999066302',
  capiEndpoint: 'https://capi-api-gabriel.onrender.com/event',
  successPage: 'cadastro_confirmado.html',
  pixelId: '1443325817705768',
  value: 25.00,
  currency: 'BRL'
};


/* =========================================================
   COOKIE / TRACKING
========================================================= */

function getCookie(name) {
  const match = document.cookie.match(
    new RegExp('(^|;\\s*)' + name + '=([^;]*)')
  );

  return match ? decodeURIComponent(match[2]) : '';
}


function captureFacebookTracking() {
  try {
    const params = new URLSearchParams(window.location.search);

    const fbclid = params.get('fbclid');

    let fbp = getCookie('_fbp');
    let fbc = getCookie('_fbc');

    /*
      Se veio de anúncio Meta e existe fbclid,
      criamos o _fbc.
    */
    if (fbclid) {
      const newFbc = `fb.1.${Date.now()}.${fbclid}`;

      document.cookie =
        `_fbc=${encodeURIComponent(newFbc)}; ` +
        `Max-Age=${60 * 60 * 24 * 730}; ` +
        `Path=/; SameSite=Lax`;

      localStorage.setItem('_fbc', newFbc);

      fbc = newFbc;
    }

    /*
      Se o navegador ainda não possui _fbp,
      criamos um identificador.
    */
    if (!fbp) {
      fbp =
        `fb.1.${Date.now()}.` +
        `${Math.floor(Math.random() * 10000000000)}`;

      document.cookie =
        `_fbp=${fbp}; ` +
        `Max-Age=${60 * 60 * 24 * 90}; ` +
        `Path=/; SameSite=Lax`;
    }

    if (fbp) {
      localStorage.setItem('_fbp', fbp);
    }

    if (fbc) {
      localStorage.setItem('_fbc', fbc);
    }

    return { fbp, fbc };

  } catch (error) {
    console.warn('Erro ao capturar tracking:', error);

    return {
      fbp: localStorage.getItem('_fbp') || '',
      fbc: localStorage.getItem('_fbc') || ''
    };
  }
}


/* =========================================================
   INITIATE CHECKOUT
========================================================= */

function fireInitiateCheckout() {

  if (sessionStorage.getItem('sf_ic_fired') === '1') {
    return;
  }

  if (typeof fbq === 'undefined') {
    return;
  }

  const eventId =
    'ic_' +
    Date.now() +
    '_' +
    Math.random().toString(36).slice(2, 10);

  fbq(
    'track',
    'InitiateCheckout',
    {
      content_name: 'StreamForce Premium',
      content_category: 'Registration',
      content_ids: ['streamforce-premium'],
      value: CONFIG.value,
      currency: CONFIG.currency
    },
    {
      eventID: eventId
    }
  );

  sessionStorage.setItem('sf_ic_fired', '1');
  sessionStorage.setItem('sf_ic_event_id', eventId);

  console.log('InitiateCheckout enviado:', eventId);
}


/* =========================================================
   COMPLETE REGISTRATION
========================================================= */

function getRegistrationEventId() {

  let eventId =
    sessionStorage.getItem('sf_registration_event_id');

  if (!eventId) {

    eventId =
      'reg_' +
      Date.now() +
      '_' +
      Math.random().toString(36).slice(2, 10);

    sessionStorage.setItem(
      'sf_registration_event_id',
      eventId
    );
  }

  return eventId;
}


async function fireCompleteRegistration(formData) {

  if (typeof fbq === 'undefined') {
    throw new Error('Meta Pixel não carregado.');
  }

  const eventId = getRegistrationEventId();

  const tracking = captureFacebookTracking();

  /*
    Guarda os dados para a página final.
  */
  localStorage.setItem(
    'user_name',
    formData.nome
  );

  localStorage.setItem(
    'user_email',
    formData.email
  );

  localStorage.setItem(
    'user_phone',
    formData.whatsapp
  );

  localStorage.setItem(
    'registration_time',
    String(Date.now())
  );

  if (tracking.fbp) {
    localStorage.setItem(
      '_fbp',
      tracking.fbp
    );
  }

  if (tracking.fbc) {
    localStorage.setItem(
      '_fbc',
      tracking.fbc
    );
  }


  /* -----------------------------------------
     Browser Pixel
  ----------------------------------------- */

  fbq(
    'track',
    'CompleteRegistration',
    {
      content_name: 'Ativação de Cadastro',
      content_category: 'Registration',
      content_ids: ['streamforce-premium'],
      value: CONFIG.value,
      currency: CONFIG.currency
    },
    {
      eventID: eventId
    }
  );


  /* -----------------------------------------
     CAPI
  ----------------------------------------- */

  const payload = {

    event_name: 'CompleteRegistration',

    event_id: eventId,

    event_source_url: window.location.href,

    user: {

      name: formData.nome,

      email: formData.email,

      phone: formData.whatsapp,

      fbp: tracking.fbp || '',

      fbc: tracking.fbc || ''

    },

    custom_data: {

      content_ids: ['streamforce-premium'],

      content_name: 'Ativação de Cadastro',

      content_category: 'Registration',

      value: CONFIG.value,

      currency: CONFIG.currency

    }

  };


  const response = await fetch(
    CONFIG.capiEndpoint,
    {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify(payload),

      keepalive: true
    }
  );


  if (!response.ok) {
    throw new Error(
      `CAPI HTTP ${response.status}`
    );
  }


  const result = await response.json();

  if (result.ok === false) {
    throw new Error(
      result.error || 'Erro na CAPI'
    );
  }


  console.log(
    'CompleteRegistration CAPI enviado:',
    eventId
  );

  return eventId;
}


/* =========================================================
   FORMULÁRIO
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    captureFacebookTracking();


    const form =
      document.getElementById(
        'registrationForm'
      );

    if (!form) {
      console.error(
        'registrationForm não encontrado.'
      );

      return;
    }


    /*
      InitiateCheckout no primeiro contato
      real com o formulário.
    */
    form.querySelectorAll('input').forEach(
      input => {

        input.addEventListener(
          'focus',
          fireInitiateCheckout,
          { once: true }
        );

      }
    );


    /*
      Usa UM único listener para o submit.
    */
    form.addEventListener(
      'submit',
      async function(e) {

        e.preventDefault();


        const btn =
          document.getElementById(
            'submitBtn'
          );


        const nome =
          document.getElementById(
            'nome'
          ).value.trim();


        const email =
          document.getElementById(
            'email'
          ).value.trim();


        const whatsapp =
          document.getElementById(
            'whatsapp'
          ).value.trim();


        /*
          Validação básica.
        */

        if (nome.length < 2) {

          notify(
            'Digite seu nome completo.',
            'error'
          );

          return;
        }


        if (
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
        ) {

          notify(
            'Digite um e-mail válido.',
            'error'
          );

          return;
        }


        const phoneDigits =
          whatsapp.replace(/\D/g, '');


        if (
          phoneDigits.length < 10 ||
          phoneDigits.length > 13
        ) {

          notify(
            'Digite um WhatsApp válido.',
            'error'
          );

          return;
        }


        try {

          btn.classList.add('loading');

          btn.disabled = true;


          await fireCompleteRegistration({
            nome,
            email,
            whatsapp
          });


          /*
            Pequeno tempo visual para o usuário
            perceber que o cadastro foi concluído.
          */

          const success =
            document.getElementById(
              'successCheckmark'
            );

          if (success) {
            success.classList.add('show');
          }


          /*
            Redirecionamento.
          */

          setTimeout(
            () => {

              window.location.href =
                CONFIG.successPage;

            },
            800
          );


        } catch (error) {

          console.error(
            'Erro no CompleteRegistration:',
            error
          );


          notify(
            'Não foi possível concluir o cadastro. Tente novamente.',
            'error'
          );


          btn.classList.remove(
            'loading'
          );

          btn.disabled = false;

        }

      }
    );

  }
);
</script>
</body>
</html>
